name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite and Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NARRAI_WARMUP: "0" # tests never call a real model
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: narrai
          POSTGRES_PASSWORD: narrai
          POSTGRES_DB: narrai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U narrai -d narrai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Tests on Postgres
        run: python -m pytest -q
        env:
          NARRAI_TEST_DATABASE_URL: postgresql+psycopg://narrai:narrai@localhost:5432/narrai_test

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose build backend frontend
