# Use the Ollama app running on the host (GPU-accelerated on Apple Silicon) instead of the container.
#   docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml up --build postgres backend frontend
services:
  backend:
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Still needs the database, but not the Ollama containers.
    depends_on: !override
      postgres:
        condition: service_healthy
