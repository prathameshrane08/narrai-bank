# One command: `docker compose up --build`, then open http://localhost:3000
#
# Services: Ollama (local LLM) -> model download (first run only) -> API -> web app.
# On a Mac, Ollama inside Docker runs on CPU only; for GPU speed use the native
# Ollama app instead:  docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml up --build
name: narrai

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: narrai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-narrai-local-only}
      POSTGRES_DB: narrai
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narrai -d narrai"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-pull:
    # Downloads the model into the shared volume once; later runs finish instantly.
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${NARRAI_MODEL:-llama3.2:3b}"]
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://narrai:${POSTGRES_PASSWORD:-narrai-local-only}@postgres:5432/narrai
      NARRAI_SEED_DEMO: "1" # demo customers for every bank; turn off for real data
      NARRAI_DEMO_MODE: "1" # demo sign-in screen; must be off for real customers
      NARRAI_TOKEN_SECRET: ${NARRAI_TOKEN_SECRET:-} # empty = temporary secret per start (demo only)
      OLLAMA_HOST: http://ollama:11434
      NARRAI_MODEL: ${NARRAI_MODEL:-llama3.2:3b}
      NARRAI_FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly, so this is the host-facing URL.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_TENANT: ${NARRAI_TENANT:-narrai}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  ollama-models:
